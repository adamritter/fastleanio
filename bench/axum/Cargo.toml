[package]
name = "fastleanio-axum-baseline"
version = "0.1.0"
edition = "2024"
[dependencies]
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["rt", "macros", "net", "fs", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
base64 = "0.22"
[profile.release]
lto = "thin"
codegen-units = 1
