name = "fastleanio"
version = "0.1.0"
defaultTargets = ["FastLeanIO", "feature_server", "action_checks", "feature_checks", "streaming_checks"]
[[require]]
name = "fast_http"
git = "https://github.com/adamritter/lean-fasthttp"
rev = "69e8f30075544c1d202ae5ac194ba8caccd6ceb4"
[[lean_lib]]
name = "FastLeanIO"
globs = ["FastLeanIO", "FastLeanIO.+"]
[[lean_exe]]
name = "feature_server"
root = "FeatureServer"
[[lean_exe]]
name = "action_checks"
root = "ActionChecks"

[[lean_exe]]
name = "streaming_checks"
root = "StreamingChecks"

[[lean_exe]]
name = "feature_checks"
root = "FeatureChecks"
